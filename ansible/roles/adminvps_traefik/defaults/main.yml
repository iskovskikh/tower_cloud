---
# adminvps — public front end (ADR-0003, superseded by ADR-0006/0007): Traefik
# terminates public TLS with Let's Encrypt (HTTP-01) and re-encrypts to the
# home ingress-nginx over the Xray VLESS Reality + SSH reverse tunnel, with a
# wstunnel (WSS) reverse tunnel as the fallback transport. Traefik runs as a
# Docker Compose service (the VPS had no Docker before this role).
# See ADR-0003 / ADR-0004 / ADR-0006 / ADR-0007.

adminvps_traefik_dir: /etc/traefik
adminvps_traefik_image: "traefik:v3.7.14"

# ACME account contact. Not a secret; kept as a role variable (never hard-coded
# in templates). Let's Encrypt uses it for expiry/renewal warnings.
adminvps_traefik_acme_email: "iskovskikh@gmail.com"

# Public hostnames Traefik serves. Each gets an individual Let's Encrypt
# certificate via HTTP-01 (no wildcard — ADR-0004). The matching k8s Ingress
# must also list the host (k8s/apps/{opencloud,keycloak}/ingress.yaml).
adminvps_traefik_hosts:
  - cloud.metoda.cc   # OpenCloud
  - auth.metoda.cc    # Keycloak
  - hermes.metoda.cc  # Hermes Agent dashboard
  - gitlab.metoda.cc  # GitLab

# ingress-nginx runs as a hostNetwork DaemonSet on every k8s node, so any node
# is an entry point. Traefik re-encrypts (HTTPS); the internal `tower-ca`
# certificate is not trusted on the VPS, so verification is skipped (the tunnel
# is already encrypted).
#
# Two transports can publish the ingress on adminvps loopback:
#   * primary  — Xray VLESS Reality + SSH reverse tunnel (role xray_tunnel)
#                binds 10443 (HTTPS) / 12222 (GitLab SSH);
#   * fallback — wstunnel over WebSocket/TLS (role wstunnel_fallback) binds
#                10444 / 12223, used when VLESS Reality is DPI-blocked.
# A systemd timer probes the primary ports and rewrites `conf.d/backend.yml`
# atomically, so Traefik follows the healthy transport without a restart.
adminvps_traefik_primary_https_port: 10443
adminvps_traefik_fallback_https_port: 10444
adminvps_traefik_primary_ingress_servers:
  - "https://127.0.0.1:{{ adminvps_traefik_primary_https_port }}"
adminvps_traefik_primary_gitlab_ssh_servers:
  - 127.0.0.1:12222
adminvps_traefik_fallback_ingress_servers:
  - "https://127.0.0.1:{{ adminvps_traefik_fallback_https_port }}"
adminvps_traefik_fallback_gitlab_ssh_servers:
  - 127.0.0.1:12223

# Failover probe. Switch only after N consecutive checks agree, to avoid
# flapping while a reverse tunnel reconnects.
adminvps_traefik_failover_interval: 30
adminvps_traefik_failover_threshold: 2

# wstunnel server behind Traefik. `relay.metoda.cc` already resolves to this
# VPS via the `*.metoda.cc` A record; Traefik terminates TLS and forwards plain
# WebSocket to the loopback server. Keep in sync with role wstunnel_fallback.
adminvps_traefik_relay_host: relay.metoda.cc
adminvps_traefik_relay_backend: http://127.0.0.1:8080

# The home provider throttles TLS on non-standard ports, so the Xray VLESS
# Reality transport also runs on public :443. Traefik peeks the TLS SNI and
# passes the camouflage name through untouched to the Xray inbound; every other
# SNI is terminated and served by the HTTP routers. The Xray serverName must
# match `xray_tunnel_server_name` in the xray_tunnel role.
adminvps_traefik_xray_reality_sni: "www.oracle.com"
adminvps_traefik_xray_reality_backend: "127.0.0.1:36243"
