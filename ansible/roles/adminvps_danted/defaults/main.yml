---
# Cluster egress through the adminvps SOCKS proxy (danted, already running).
# The cluster cannot reach Telegram directly (all API IPs time out), so the
# Hermes gateway uses this proxy. Only the WireGuard peer and the k8s node
# network may use it without a username/password; every other client keeps the
# original danted auth.
adminvps_danted_wg_ip: "10.200.0.1"
adminvps_danted_cluster_cidr: "10.10.120.0/24"
adminvps_danted_wg_cidr: "10.200.0.0/24"
