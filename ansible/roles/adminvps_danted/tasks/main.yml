---
- name: adminvps_danted | require the existing danted config
  ansible.builtin.stat:
    path: /etc/danted.conf
  register: adminvps_danted_conf

- name: adminvps_danted | fail when danted is not installed
  ansible.builtin.assert:
    that: adminvps_danted_conf.stat.exists
    fail_msg: "danted is not installed on adminvps"

# WireGuard was retired 2026-11-14; remove the additional listener an older
# revision added on 10.200.0.1.
- name: adminvps_danted | remove the retired WireGuard listener
  ansible.builtin.lineinfile:
    path: /etc/danted.conf
    regexp: '^internal:\s+10\.200\.0\.1\s+port\s*=\s*1080\s*$'
    state: absent
    backup: true
  notify: restart danted

# `none` must be part of the global method list before a rule can select it.
# The default catch-all rule below keeps password auth explicitly.
- name: adminvps_danted | allow per-rule method selection
  ansible.builtin.lineinfile:
    path: /etc/danted.conf
    regexp: '^socksmethod:\s+username\s*$'
    line: "socksmethod: username none"
    backup: true
  notify: restart danted

# Only the cluster network may skip authentication. The WireGuard-network rule
# was dropped when WireGuard was retired (2026-11-14).
- name: adminvps_danted | allow the cluster network without auth
  ansible.builtin.blockinfile:
    path: /etc/danted.conf
    marker: "# {mark} ANSIBLE MANAGED: hermes cluster egress"
    insertbefore: '^client pass \{'
    block: |
      socks pass {
          from: {{ adminvps_danted_cluster_cidr }} to: 0.0.0.0/0
          socksmethod: none
          command: connect
      }
    backup: true
  notify: restart danted

# Keep the original catch-all password rule for every other client.
- name: adminvps_danted | keep password auth on the catch-all rule
  ansible.builtin.lineinfile:
    path: /etc/danted.conf
    insertbefore: '^    command: connect bind udpassociate$'
    line: "    socksmethod: username"
    backup: true
  notify: restart danted

- name: adminvps_danted | validate the rendered config
  ansible.builtin.command:
    cmd: danted -f /etc/danted.conf -V
  changed_when: false

- name: adminvps_danted | allow the cluster network to reach danted
  community.general.ufw:
    rule: allow
    port: "1080"
    proto: tcp
    from: "{{ adminvps_danted_cluster_cidr }}"
    comment: hermes-egress

# The WireGuard-network exception is dead with the tunnel; remove it so :1080
# is closed except for the cluster rule above.
- name: adminvps_danted | remove the retired WireGuard UFW rule
  community.general.ufw:
    rule: allow
    delete: true
    port: "1080"
    proto: tcp
    from_ip: "10.200.0.0/24"
  register: adminvps_danted_retired_ufw
  failed_when: >-
    adminvps_danted_retired_ufw is failed and
    'Could not delete non-existent rule' not in
    (adminvps_danted_retired_ufw.stderr | default(''))
