---
# iSCSI initiator on the k8s nodes so pods can attach block volumes from tower.
#
# We deliberately do NOT log in here: the kubelet in-tree iscsi plugin performs
# discovery + login on attach and logout on detach, so only the node that
# actually uses a volume holds a session. Pre-logging every node to the target
# leaves stale (pre-format) device views on the other nodes, and a later
# reschedule makes their kubelet reformat the LUN — destroying data.

- name: initiator | install open-iscsi
  ansible.builtin.apt:
    name: open-iscsi
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: initiator | ensure iscsid is enabled and running
  ansible.builtin.service:
    name: iscsid
    state: started
    enabled: true

- name: initiator | discover targets on tower (populate node records, no login)
  ansible.builtin.command:
    cmd: iscsiadm -m discovery -t sendtargets -p {{ tower_iscsi_portal }}
  register: tower_iscsi_disc
  changed_when: false

