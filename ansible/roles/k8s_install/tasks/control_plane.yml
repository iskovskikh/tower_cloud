---
# Control plane: kubeadm init + kubeconfig + Calico (operator).

- name: kubeadm init
  ansible.builtin.command:
    cmd: >-
      kubeadm init
      --control-plane-endpoint={{ control_plane_endpoint }}
      --apiserver-advertise-address={{ apiserver_advertise_address }}
      --pod-network-cidr={{ pod_cidr }}
      --cri-socket=unix:///var/run/containerd/containerd.sock
  args:
    creates: /etc/kubernetes/admin.conf

- name: Ensure user kubeconfig dir
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Install user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Wait for the API server
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get --raw=/readyz
  register: api_ready
  retries: 20
  delay: 6
  until: api_ready.rc == 0
  changed_when: false

- name: Install Calico operator
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f {{ tigera_operator_manifest }}"
  register: calico_operator
  changed_when: "'created' in calico_operator.stdout or 'configured' in calico_operator.stdout"

- name: Wait for the Calico Installation CRD to appear
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get crd installations.operator.tigera.io
  register: calico_crd
  retries: 30
  delay: 5
  until: calico_crd.rc == 0
  changed_when: false

- name: Wait for the Calico Installation CRD to be Established
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      wait --for=condition=Established
      crd/installations.operator.tigera.io --timeout=120s
  changed_when: false

- name: Copy Calico Installation manifest
  ansible.builtin.copy:
    src: calico-installation.yaml
    dest: /tmp/calico-installation.yaml
    mode: '0644'

- name: Apply Calico Installation (pod CIDR {{ pod_cidr }})
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /tmp/calico-installation.yaml"
  register: calico_installation
  retries: 10
  delay: 5
  until: calico_installation.rc == 0
  changed_when: "'created' in calico_installation.stdout or 'configured' in calico_installation.stdout"
