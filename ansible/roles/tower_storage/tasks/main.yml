---
# Storage appliance on tower: NFS (RWX), iSCSI/LIO (RWO), Garage (S3).
# See docs/storage/plan.md and docs/adr/0001-infrastructure-as-code.md.

- name: dm-cache (Optane cache for the data array)
  ansible.builtin.import_tasks: dmcache.yml
  when: tower_cache_enabled | bool
  tags: [tower_cache]

- name: NFS export
  ansible.builtin.import_tasks: nfs.yml
  when: tower_nfs_enabled | bool

- name: iSCSI LIO target
  ansible.builtin.import_tasks: iscsi.yml
  when: tower_iscsi_enabled | bool

- name: Garage object storage
  ansible.builtin.import_tasks: garage.yml
  when: tower_garage_enabled | bool

- name: Postgres database
  ansible.builtin.import_tasks: postgres.yml
  when: tower_postgres_enabled | bool
