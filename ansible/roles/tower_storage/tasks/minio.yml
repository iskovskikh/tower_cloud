---
# MinIO S3 object storage on tower, run as a Docker container.
# Credentials come from the environment (MINIO_ROOT_PASSWORD); never commit.

- name: minio | require root password
  ansible.builtin.assert:
    that: tower_minio_root_password | length > 0
    fail_msg: >-
      tower_minio_root_password is empty. Export MINIO_ROOT_PASSWORD (or pass
      -e tower_minio_root_password=...) — secrets are not stored in the repo.

- name: minio | install Docker SDK for Ansible
  community.general.pacman:
    name:
      - python-docker
      - python-requests
    state: present

- name: minio | create data directory
  ansible.builtin.file:
    path: "{{ tower_minio_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: minio | run container
  community.docker.docker_container:
    name: minio
    image: "{{ tower_minio_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ tower_minio_api_port }}:9000"
      - "{{ tower_minio_console_port }}:9001"
    env:
      MINIO_ROOT_USER: "{{ tower_minio_root_user }}"
      MINIO_ROOT_PASSWORD: "{{ tower_minio_root_password }}"
    volumes:
      - "{{ tower_minio_data_dir }}:/data"
    command: 'server /data --console-address ":9001"'
