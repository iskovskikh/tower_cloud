---
# OpenWrt router: routing + firewall between LAN, server segment and VLAN 120.
# Configured declaratively via uci; storage ports 2049/3260/3900 must reach the
# cluster. Idempotent: options are only written when they differ, and the
# firewall reloads only when something actually changed.
#
# Driven through `raw` because OpenWrt has no Python, so the usual modules
# (shell/command/community.general.uci) cannot run there.

- name: Apply storage forwarding + firewall rules (uci)
  ansible.builtin.raw: |
    set -eu
    changed=0

    ensure_type() {
      cur="$(uci -q get firewall.$1 2>/dev/null || true)"
      if [ "$cur" != "$2" ]; then uci set firewall.$1="$2"; changed=1; fi
    }
    set_opt() {
      cur="$(uci -q get firewall.$1.$2 2>/dev/null || true)"
      if [ "$cur" != "$3" ]; then uci set firewall.$1.$2="$3"; changed=1; fi
    }

    {% for sec in router_openwrt_remove_sections %}
    if uci -q get firewall.{{ sec }} >/dev/null 2>&1; then uci -q delete firewall.{{ sec }}; changed=1; fi
    {% endfor %}

    {% for f in router_openwrt_forwardings %}
    ensure_type {{ f.name }} forwarding
    set_opt {{ f.name }} src {{ f.src }}
    set_opt {{ f.name }} dest {{ f.dest }}
    {% endfor %}

    {% for r in router_openwrt_rules %}
    ensure_type {{ r.name }} rule
    set_opt {{ r.name }} name "{{ r.title }}"
    set_opt {{ r.name }} src {{ r.src }}
    set_opt {{ r.name }} dest {{ r.dest }}
    set_opt {{ r.name }} proto {{ r.proto }}
    set_opt {{ r.name }} dest_port "{{ r.ports }}"
    set_opt {{ r.name }} target {{ r.target }}
    {% endfor %}

    if [ "$changed" = 1 ]; then
      uci commit firewall
      echo CHANGED
    else
      echo OK
    fi
  register: router_fw
  changed_when: "'CHANGED' in router_fw.stdout"
  notify: reload firewall

- name: Route the server segment via the server router
  ansible.builtin.raw: |
    set -eu
    changed=0
    set_if_diff() {
      cur="$(uci -q get $1 2>/dev/null || true)"
      if [ "$cur" != "$2" ]; then uci set $1="$2"; changed=1; fi
    }
    del_opt() { if uci -q get $1 >/dev/null 2>&1; then uci -q delete $1; changed=1; fi; }

    {% for i in router_openwrt_stale_l3_interfaces %}
    set_if_diff network.{{ i }}.proto none
    del_opt network.{{ i }}.ipaddr
    del_opt network.{{ i }}.netmask
    {% endfor %}

    {% for r in router_openwrt_static_routes %}
    if [ "$(uci -q get network.{{ r.name }} 2>/dev/null || true)" != "route" ]; then uci set network.{{ r.name }}=route; changed=1; fi
    set_if_diff network.{{ r.name }}.interface lan
    set_if_diff network.{{ r.name }}.target {{ r.target }}
    set_if_diff network.{{ r.name }}.netmask {{ r.netmask }}
    set_if_diff network.{{ r.name }}.gateway {{ r.gateway }}
    {% endfor %}

    if [ "$changed" = 1 ]; then uci commit network; echo CHANGED; else echo OK; fi
  register: router_rt
  changed_when: "'CHANGED' in router_rt.stdout"
  notify: reload network

- name: Label the WAN interfaces with their providers (network config legend)
  ansible.builtin.raw: |
    set -eu
    missing=0
    {% for line in router_openwrt_network_legend %}
    grep -qxF '{{ line }}' /etc/config/network || missing=1
    {% endfor %}

    if [ "$missing" = 1 ]; then
      legend="$(mktemp)"
      merged="$(mktemp)"
      {% for line in router_openwrt_network_legend %}
      printf '%s\n' '{{ line }}' >> "$legend"
      {% endfor %}
      cp "$legend" "$merged"
      awk 'NR==FNR { skip[$0]=1; next } !($0 in skip)' "$legend" /etc/config/network >> "$merged"
      cat "$merged" > /etc/config/network
      rm -f "$legend" "$merged"
      echo CHANGED
    else
      echo OK
    fi
  register: router_wan_legend
  changed_when: "'CHANGED' in router_wan_legend.stdout"

- name: Allow LAN hairpin to the server segment
  ansible.builtin.raw: |
    set -eu
    changed=0
    set_if_diff() {
      cur="$(uci -q get $1 2>/dev/null || true)"
      if [ "$cur" != "$2" ]; then uci set $1="$2"; changed=1; fi
    }

    {% for r in router_openwrt_forward_rules %}
    if [ "$(uci -q get firewall.{{ r.name }} 2>/dev/null || true)" != "rule" ]; then uci set firewall.{{ r.name }}=rule; changed=1; fi
    set_if_diff firewall.{{ r.name }}.name "{{ r.title }}"
    set_if_diff firewall.{{ r.name }}.src {{ r.src }}
    set_if_diff firewall.{{ r.name }}.dest {{ r.dest }}
    set_if_diff firewall.{{ r.name }}.family {{ r.family }}
    set_if_diff firewall.{{ r.name }}.target ACCEPT
    {% endfor %}

    if [ "$changed" = 1 ]; then uci commit firewall; echo CHANGED; else echo OK; fi
  register: router_fwd_rules
  changed_when: "'CHANGED' in router_fwd_rules.stdout"
  notify: reload firewall

- name: Apply cluster DNS wildcard (dnsmasq)
  ansible.builtin.raw: |
    set -eu
    changed=0

    want="{% for a in router_openwrt_dns_addresses %}{{ a }} {% endfor %}"
    have="$(uci -q get dhcp.@dnsmasq[0].address 2>/dev/null || true)"

    want_norm="$(printf '%s\n' $want | grep . | sort | tr '\n' ' ' || true)"
    have_norm="$(printf '%s\n' $have | grep . | sort | tr '\n' ' ' || true)"

    if [ "$want_norm" != "$have_norm" ]; then
      uci -q delete dhcp.@dnsmasq[0].address 2>/dev/null || true
      {% for a in router_openwrt_dns_addresses %}
      uci -q add_list dhcp.@dnsmasq[0].address='{{ a }}'
      {% endfor %}
      uci commit dhcp
      changed=1
    fi

    if [ "$changed" = 1 ]; then echo CHANGED; else echo OK; fi
  register: router_dns
  changed_when: "'CHANGED' in router_dns.stdout"
  notify: reload dnsmasq

- name: Pin the server router's WAN (dnsmasq DHCP reservation)
  ansible.builtin.raw: |
    set -eu
    changed=0
    set_opt() {
      cur="$(uci -q get $1 2>/dev/null || true)"
      if [ "$cur" != "$2" ]; then uci set $1="$2"; changed=1; fi
    }

    {% for h in router_openwrt_dhcp_hosts %}
    if [ "$(uci -q get dhcp.{{ h.section }} 2>/dev/null || true)" != "host" ]; then uci set dhcp.{{ h.section }}=host; changed=1; fi
    set_opt dhcp.{{ h.section }}.name "{{ h.name }}"
    set_opt dhcp.{{ h.section }}.mac "{{ h.mac }}"
    set_opt dhcp.{{ h.section }}.ip "{{ h.ip }}"
    set_opt dhcp.{{ h.section }}.dns "1"
    {% endfor %}

    if [ "$changed" = 1 ]; then uci commit dhcp; echo CHANGED; else echo OK; fi
  register: router_dhcp_hosts
  changed_when: "'CHANGED' in router_dhcp_hosts.stdout"
  notify: reload dnsmasq

- name: Flush stale conntrack entries on WAN interface events (mwan3)
  ansible.builtin.raw: |
    set -eu
    changed=0

    {% for i in router_openwrt_mwan3_flush_interfaces %}
    if uci -q get mwan3.{{ i }} >/dev/null 2>&1; then
      want="{% for a in router_openwrt_mwan3_flush_actions %}{{ a }} {% endfor %}"
      have="$(uci -q get mwan3.{{ i }}.flush_conntrack 2>/dev/null || true)"
      want_norm="$(printf '%s\n' $want | grep . | sort | tr '\n' ' ' || true)"
      have_norm="$(printf '%s\n' $have | grep . | sort | tr '\n' ' ' || true)"
      if [ "$want_norm" != "$have_norm" ]; then
        uci -q delete mwan3.{{ i }}.flush_conntrack 2>/dev/null || true
        {% for a in router_openwrt_mwan3_flush_actions %}
        uci -q add_list mwan3.{{ i }}.flush_conntrack='{{ a }}'
        {% endfor %}
        changed=1
      fi
    fi
    {% endfor %}

    if [ "$changed" = 1 ]; then uci commit mwan3; echo CHANGED; else echo OK; fi
  register: router_mwan3_flush
  changed_when: "'CHANGED' in router_mwan3_flush.stdout"

- name: Prefer the primary WAN for new flows (mwan3 policy)
  ansible.builtin.raw: |
    set -eu
    changed=0
    policy='{{ router_openwrt_mwan3_policy }}'

    {% for rule in ['https', 'default_rule_v4', 'default_rule_v6'] %}
    cur="$(uci -q get mwan3.{{ rule }}.use_policy 2>/dev/null || true)"
    if [ -n "$cur" ] && [ "$cur" != "$policy" ]; then
      uci set mwan3.{{ rule }}.use_policy="$policy"
      changed=1
    fi
    {% endfor %}

    if [ "$changed" = 1 ]; then uci commit mwan3; echo CHANGED; else echo OK; fi
  register: router_mwan3_policy
  changed_when: "'CHANGED' in router_mwan3_policy.stdout"
  notify: restart mwan3
