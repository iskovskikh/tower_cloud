---
# OpenWrt router: LAN gateway + firewall.
#
# The server segment (192.168.30.0/24 = tower/proxmox) and the k8s cluster
# (VLAN120 = 10.10.120.0/24) live *behind the server router* (the Keenetic,
# 192.168.1.216), reached over this router's LAN. This router therefore has to
# route those subnets via the server router and let LAN clients hairpin through;
# the old dedicated trunk is unused (link down), so the subnets must NOT be
# advertised as directly connected here (that blackholes the traffic).
#
# See docs/storage/plan.md (storage ports 2049/3260/3900).

router_openwrt_server_router: "192.168.1.216"

# Interfaces whose (now stale) connected L3 config must be disabled: the old
# server/Kubernetes trunk is gone, so these are routed via the server router.
router_openwrt_stale_l3_interfaces:
  - srv
  - Lan120

router_openwrt_static_routes:
  - {name: rt_srv, target: "192.168.30.0", netmask: "255.255.255.0", gateway: "{{ router_openwrt_server_router }}"}
  - {name: rt_k8s, target: "10.10.120.0", netmask: "255.255.255.0", gateway: "{{ router_openwrt_server_router }}"}

# Allow LAN clients to hairpin through this router to the server-router subnets
# (this router's lan zone is otherwise forward=REJECT, which drops the hairpin).
router_openwrt_forward_rules:
  - {name: hairpin_lan, title: "LAN hairpin -> server segment", src: lan, dest: lan, family: ipv4}

# No broad zone-pair forwarding: only the ports in router_openwrt_rules are
# allowed through, so the zones keep their default REJECT for everything else.
router_openwrt_forwardings: []

# Previously-added sections to delete if present (we used to allow the whole
# vlan120 -> srv zone pair, which opened every port).
router_openwrt_remove_sections:
  - k8s_v120_to_srv

# Ports opened through the router. Return traffic is stateful (conntrack).
router_openwrt_rules:
  - name: k8s_v120_srv_storage
    title: "k8s storage: NFS/iSCSI/Garage S3 -> tower"
    src: vlan120
    dest: srv
    proto: tcp
    ports: "2049 3260 3900 5432"
    target: ACCEPT

# --- DNS (dnsmasq) ----------------------------------------------------------
# Wildcard records for cluster services. Each entry becomes a dnsmasq
# `--address=<domain>/<ip>` line: dnsmasq answers for the domain and all its
# subdomains and never forwards them (so any new Ingress host under the domain
# resolves without touching DNS). ingress-nginx runs as a hostNetwork DaemonSet
# on every node, so one entry per node IP is returned (round-robin / failover).
# Service Ingresses use <name>.k8s.lan.
router_openwrt_dns_addresses:
  - "/k8s.lan/10.10.120.101"
  - "/k8s.lan/10.10.120.102"
  - "/k8s.lan/10.10.120.103"
  - "/k8s.lan/10.10.120.104"
  # Split-horizon for the Keycloak OIDC issuer: the public hostname
  # (auth.metoda.cc, KC_HOSTNAME) resolves internally to ingress-nginx, so
  # oauth2-proxy/Vault reach the issuer without a round trip via adminvps. On
  # the public internet the same name resolves to adminvps (Timeweb zone).
  - "/auth.metoda.cc/10.10.120.101"
  - "/auth.metoda.cc/10.10.120.102"
  - "/auth.metoda.cc/10.10.120.103"
  - "/auth.metoda.cc/10.10.120.104"
  # Same split-horizon for OpenCloud: OC_URL is the public name
  # (cloud.metoda.cc) and clients bootstrap against it, so it must resolve
  # internally to ingress-nginx (publicly Timeweb answers it -> adminvps).
  - "/cloud.metoda.cc/10.10.120.101"
  - "/cloud.metoda.cc/10.10.120.102"
  - "/cloud.metoda.cc/10.10.120.103"
  - "/cloud.metoda.cc/10.10.120.104"
