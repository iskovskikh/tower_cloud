---
- name: reload firewall
  ansible.builtin.raw: /etc/init.d/firewall reload
  changed_when: false

- name: reload network
  ansible.builtin.raw: /etc/init.d/network reload
  changed_when: false

- name: reload dnsmasq
  ansible.builtin.raw: /etc/init.d/dnsmasq reload
  changed_when: false

- name: restart mwan3
  ansible.builtin.raw: /etc/init.d/mwan3 restart
  changed_when: false
