---
# Installs the local public-path health probe on archasus (the Ansible
# controller). Kept out of site.yml because it configures the controller, not
# a remote host: run it explicitly.
#
#   ansible-playbook ansible/playbooks/monitoring.yml
#   # with alerting (healthchecks.io ping URL, which is a secret):
#   ansible-playbook ansible/playbooks/monitoring.yml \
#     -e archasus_monitoring_healthchecks_ping_url='https://hc-ping.com/<uuid>'
- name: archasus — public-path health probe
  hosts: archasus
  become: true
  roles:
    - archasus_monitoring
