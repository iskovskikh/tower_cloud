kubernetes:
  cluster: tower-cloud
  status: up              # rebuilt 2026-10-13
  provisioner: kubeadm
  version: v1.37.1
  cni: calico             # Calico v3.33 (operator), pod CIDR 10.244.0.0/16
  api_endpoint: "10.10.120.101:6443"
  # provisioned by OpenTofu, configured by Ansible — see docs/adr/0001
  nodes:
    - {id: k8s-node-1, ip: 10.10.120.101, role: control-plane, vmid: 101, vcpu: 2, mem_mb: 4096, disk_gb: 22}
    - {id: k8s-node-2, ip: 10.10.120.102, role: worker, vmid: 102, vcpu: 2, mem_mb: 3072, disk_gb: 22}
    - {id: k8s-node-3, ip: 10.10.120.103, role: worker, vmid: 103, vcpu: 2, mem_mb: 3072, disk_gb: 22}
    - {id: k8s-node-4, ip: 10.10.120.104, role: worker, vmid: 104, vcpu: 2, mem_mb: 3072, disk_gb: 22}
  notes: >
    Four Ubuntu 22.04 VMs on proxmox, VLAN 120 (DHCP from the Keenetic `dhcp.k8s`,
    static reservations .101-.104), qemu-guest-agent.
    Originally built Oct 2023 (kubeadm v1.28.3) and dead since ~2025-08 (expired
    kubelet certs). **Rebuilt 2026-10-13 via IaC** (Ansible role `k8s_install`):
    containerd 2.4.1, kubeadm v1.37.1, Calico v3.33 operator; 4/4 nodes Ready.
    kubeconfig on archasus. StorageClasses `tower-nfs` (RWX), `tower-iscsi-static`
    (RWO block), `tower-local` (RWO node-local);
    ingress-nginx (hostNetwork DaemonSet on **all** nodes, incl. control-plane
    via toleration); cert-manager; Garage S3 (runs on **tower**, :3900 — see the
    tower entry). DNS wildcard `*.k8s.lan` ->
    10.10.120.101-104 served by the router; e.g. Vault UI at
    `https://vault.k8s.lan`.
    **SSO (2026-10-13):** Keycloak 26.8.1 (canonical host `https://auth.metoda.cc`,
    ns `keycloak`) on Postgres 18.6 running **on tower** (`:5432`, no k8s LUN — see
    ADR-0002);
    realm `tower` with clients `vault` + `oauth2-proxy`; oauth2-proxy 7.15.5
    (`https://auth.k8s.lan`, ns `oauth2-proxy`) for forward-auth. Vault logs in
    via Keycloak OIDC. Secrets in Vault `secret/keycloak` -> ESO. See
    `docs/identity/README.md`.
    **Keycloak issuer (2026-10-15):** `KC_HOSTNAME=https://auth.metoda.cc`;
    split-horizon DNS added to the router dnsmasq so the issuer resolves to
    ingress-nginx inside and to adminvps outside (identical issuer); oauth2-proxy
    and Vault OIDC discovery URL switched to `auth.metoda.cc`.
    **Media (2026-10-13):** Transmission 4.1.3 in ns `media`
    (`https://transmission.k8s.lan`, linuxserver image) writes to tower's
    `/mnt/raid1/share/downloads` over NFS (RWX), shared with Jellyfin. Whole
    host behind Keycloak SSO; Transmission RPC auth disabled (single login).
    **Jellyfin 10.11.6** also in ns `media` (`https://jellyfin.k8s.lan`):
    `/config` on a **dynamic node-local PVC** (`tower-local` = local-path-
    provisioner; SQLite is unsafe on NFS, so not on tower), same NFS export
    mounted at `/media`. The old lun-4 block LUN was retired. Browser UI (`/web`) behind
    Keycloak SSO; the HTTP API and `/socket` are left open for native clients
    (Android TV, iOS, Kodi). Nodes have no `/dev/dri` → software transcoding only.
    **OpenCloud (2026-10-13):** self-hosted file sync/share/collab
    (opencloud.eu) in ns `opencloud`, canonical host `https://cloud.metoda.cc`
    (`opencloudeu/opencloud:7.2.4`); `OC_URL` set to the public name so
    `config.json`/webfinger/OIDC issuer are browser-reachable (split-horizon DNS
    on the LAN; the older `opencloud.k8s.lan` Ingress name still exists but
    cross-origin bootstraps). Storage **`decomposeds3`**: user **blobs in
    Garage S3** (bucket `opencloud`; Garage runs on tower, :3900); metadata + the
    embedded IDM on a dedicated
    tower iSCSI LUN (`opencloud`, lun 5, ext4, **sparse** → floats; POSIX+xattr
    can't be NFS); `/etc/opencloud` on a small `tower-nfs` PVC. Serves its own
    login (built-in IDM/IDP) → not behind oauth2-proxy. Verified end-to-end
    (WebDAV upload → object landed in Garage).
    **Memory (2026-10-13):** proxmox has only 16 GB, so 4×4 GB over-commits.
    Pinned: control-plane `balloon=4096` (fixed 4 GB), workers `memory=3072
    balloon=3072` (3 GB). Before this the balloon dropped guests to ~1.2 GB and
    the control-plane hit OOM (see CHANGELOG).
    **Network (2026-10-14, updated 2026-10-15):** the VLAN120 gateway/DHCP is the
    **Keenetic Omni II** (10.10.120.1, eth0.120, `dhcp.k8s`); proxmox/k8s hang off
    the Keenetic, whose port 3 to proxmox is a VLAN30+VLAN120 trunk. The main
    router's port 5 trunk is unused; the main router routes the server/cluster
    subnets via the Keenetic and now reaches them from the LAN directly
    (archasus → `kubectl`, tower, proxmox). Also reachable from `adminvps` over
    the WireGuard tunnel (ingress, nodes, API :6443).

open_questions:
  - "metoda.cc: add A records `cloud`/`auth`/`*` -> 78.17.99.16 BY HAND in hosting.timeweb.ru/domains (Timeweb Cloud API cannot see the zone); apex stays on parking."
  - "Keycloak OIDC on the public host: KC_HOSTNAME=https://auth.metoda.cc + split-horizon DNS (router dnsmasq) + oauth2-proxy/Vault issuer URLs codified and applied; verify public login end-to-end. Which services are public vs VPN-only?"
  - "No Ansible role yet for the Keenetic Omni II (OpenWrt server router) — it now carries the VLAN120 DHCP pool, routes, the wan->lan forwarding and split-horizon peering, all configured by hand. Manage it by IaC, and how?"
