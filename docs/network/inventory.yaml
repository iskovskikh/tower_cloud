  - "What is the goal of the tower_cloud project? (roles to add/migrate)"
  - "Intended role of the offline Keenetic Omni 2 (AP / backup WAN / separate LAN / OpenWrt)?"
  - "Why does archasus hold two IPv4 leases (.204 and .205) on one NIC?"
  - "What runs on the biqu* hosts (.161/.202/.203)? 3D printer controllers?"
  - "Should 192.168.30.0/24 become a proper VLAN, and is it firewalled from the LAN?"
  - "Proxmox vmbr0 is VLAN-aware and VMs use tags 110/120 — where are those VLANs defined (router? switch?)?"
  - "How should tower's /mnt/raid1 (native mdadm RAID1, no snapshots) and proxmox VMs be backed up?"
