# tower_cloud / network inventory
# Machine-readable source of truth. Keep this file in sync with reality.
# Re-generate/verify with: scripts/recon.sh
# Last verified: 2026-10-15 (see CHANGELOG.md)

meta:
  site: home
  documented_at: "2026-10-12"
  observed_from: archasus (192.168.1.204)
  method: passive discovery + read-only scans (see scripts/recon.sh)
  secrets: none stored here — credentials live outside the repo

domains:
  # Public DNS for external access. Registered AND hosted at Timeweb; the zone
  # is managed by hand in the hosting panel (hosting.timeweb.ru/domains). The
  # domain is NOT visible to the Timeweb Cloud API (GET /api/v1/domains -> 0),
  # so this is a documented exception to IaC — see ADR-0004. Keep this file in
  # sync by hand after any panel change.
  - id: metoda.cc
    role: external-access
    registrar: Timeweb
    registered: "2026-10-15"
    price_rub: {registration: 1930, renewal: 2030}
    dns:
      hosting: "Timeweb hosting panel (hosting.timeweb.ru/domains)"
      nameservers: [ns1.timeweb.ru, ns2.timeweb.ru, ns3.timeweb.org, ns4.timeweb.org]
      delegated: true   # verified 2026-10-15 (dig NS @1.1.1.1)
      iac: none         # manual — Timeweb Cloud API does not see the zone (ADR-0004)
      acme: "Let's Encrypt HTTP-01 (Traefik on adminvps :80; no DNS API, no wildcard cert)"
    records:
      # All set by hand in the panel; added 2026-10-15, verified with dig @1.1.1.1.
      - {name: cloud, type: A, value: 78.17.99.16, role: OpenCloud, status: present}
      - {name: auth,  type: A, value: 78.17.99.16, role: "Keycloak (public); split-horizon internally -> ingress-nginx", status: present}
      - {name: "*",   type: A, value: 78.17.99.16, role: "wildcard (routing only; TLS is per-host)", status: present}
      - {name: "@",   type: A, value: 78.17.99.16, role: "apex — replaced the parking A 92.53.96.201", status: present}
      - {name: www,   type: A, value: 78.17.99.16, role: "www — replaced the parking A 92.53.96.201", status: present}
      - {name: "@",   type: TXT, value: "v=spf1 include:_spf.timeweb.ru ~all", role: "default SPF (Timeweb)", status: present}
      # apex/www AAAA (registrar IPv6 parking 2a03:6f00:1::5c35:60c9) removed 2026-10-15.
    notes: >
      Chosen external domain (replaces the earlier towercloud.dev / towercloud.ru
      candidates). Front: Traefik + Let's Encrypt on adminvps (78.17.99.16) —
      **live 2026-10-15** (certs for cloud./auth. via HTTP-01) — publishing
      cloud. / auth. over the WireGuard tunnel — see ADR-0003/0004.
      DNS is managed manually in the Timeweb hosting panel: the Timeweb Cloud API
      returns no domains for this account, so records cannot be codified. TLS via
      HTTP-01 (no wildcard certificate). cloud./auth./* plus the apex and www all
      point at adminvps; the old parking A (92.53.96.201) and AAAA are gone.

subnets:
  - id: lan
    cidr: 192.168.1.0/24
    purpose: main LAN — workstations, phones, IoT
    gateway: 192.168.1.1
    dhcp: true
    dhcp_server: 192.168.1.1
  - id: servers
    cidr: 192.168.30.0/24
    purpose: server segment — NAS + hypervisor (LAN of the Keenetic Omni II)
    gateway: 192.168.30.1   # the Keenetic Omni II (OpenWrt) since 2026-10-14; was the main router
    dhcp: true
    dhcp_server: 192.168.30.1
    note: >
      Now served by the Keenetic Omni II (OpenWrt); the main router's br-srv
      (192.168.30.1, VLAN30) is orphaned. proxmox keeps a VLAN30-tagged
      management interface (vmbr0.30) that the Keenetic bridges into this
      segment; tower is on DHCP here.
  - id: k8s_vlan120
    cidr: 10.10.120.0/24
    purpose: Kubernetes nodes (VLAN 120) — isolated L2
    gateway: 10.10.120.1    # the Keenetic Omni II (eth0.120) since 2026-10-14; was the main router
    dhcp: false            # nodes keep static addressing; reservations were on the main router ❓
  - id: wg_uplink
    cidr: 10.200.0.0/24
    purpose: WireGuard tunnel adminvps <-> Keenetic (external-access path)
    gateway: 10.200.0.1     # adminvps (public VPS); peer Keenetic = 10.200.0.2
    dhcp: false
    note: >
      Server on adminvps (udp 51820) with AllowedIPs routing home nets
      (192.168.30.0/24, 10.10.120.0/24) to the Keenetic peer.
  - id: lan_v6_ula
    cidr: fde7:823d:5636::/64
    purpose: IPv6 ULA advertised by the router via RA
    gateway: fde7:823d:5636::1

hosts:
  - id: router
    role: gateway-router
    status: up
    ips:
      lan: 192.168.1.1
    mac: "c0:4a:00:fb:ff:71"
    hardware_oui: "TP-Link Technologies Co.,Ltd"
    hardware: TP-Link TL-WDR4300 v1
    os: OpenWrt (LuCI)
    os_version: "23.093.42704"
    notes: >
      OpenWrt on TP-Link hardware (TL-WDR4300 v1). Web UI (LuCI) on :80/:443,
      dropbear SSH on :22. Does DHCP/DNS for the LAN.
      2026-10-15: the server segment (192.168.30.0/24) and the cluster
      (10.10.120.0/24, VLAN120) are routed **via the Keenetic server router**
      (192.168.1.216); the stale directly-connected `br-srv`/`eth0.120` L3 (old
      trunk, link down) was disabled (`proto=none`) and replaced with static
      routes rt_srv/rt_k8s + a LAN-hairpin rule (role `router_openwrt`). Before
      this it blackholed the server/cluster subnets and duplicated the Keenetic's
      192.168.30.1. It no longer holds the VLAN120 DHCP pool.
      IPv6 ULA RA (fde7:823d:5636::/64). Zones: lan, wan, iot (192.168.20.0/24),
      vlan110 (10.10.110.0/24). The `srv`/`vlan120` zones are now empty (their
      interfaces are `proto=none`); the old vlan120->srv storage rule is inert.
      DNS (dnsmasq) serves the cluster Ingress wildcard: --address '/k8s.lan/<ip>'
      for all four node IPs (role router_openwrt, 2026-10-13), plus split-horizon
      '/auth.metoda.cc/<ip>' (2026-10-15, Keycloak issuer) and
      '/cloud.metoda.cc/<ip>' (2026-10-15, OpenCloud canonical host) so both
      public names resolve to ingress-nginx internally instead of hairpinning to
      the adminvps front end.
      2026-10-14: switch port 3 moved from VLAN30 (Servers) to VLAN1 (LAN) — the
      Keenetic Omni II's WAN now terminates there (DHCP 192.168.1.216) so its
      WAN subnet does not collide with the server segment.
    services:
      - {port: 22, proto: tcp, service: dropbear-ssh}
      - {port: 80, proto: tcp, service: luci-http}
      - {port: 443, proto: tcp, service: luci-https}
    access: "ssh root@192.168.1.1 / http://192.168.1.1  (credentials: external)"

  - id: archasus
    role: workstation
    status: up
    ips:
      lan: [192.168.1.204, 192.168.1.205]   # TWO IPv4 leases on one NIC — anomaly, see CHANGELOG
    mac: "fc:9d:05:72:97:da"
    os: Arch Linux (kernel 7.2.7-arch1-1)
    hardware: MSI MS-7D98, 1 GbE (enp3s0)
    notes: >
      This recon host. Docker host (containers: alisa-web, openwebui, postgres, ...).
      Local dev proxies: hiddify (SOCKS), ssh -D dynamic tunnel, ollama via ssh forward.
      (NFS client mount of tower:/srv/nfs/datasets was removed 2026-10-12.)
    services_localhost_only: [1080, 12334, 12336, 12337, 30000, 63342]
    access: "local"

  - id: tower
    role: nas-media-server
    status: up
    hostname: tower.lan
    ips:
      servers: 192.168.30.200   # DHCP reservation on the Keenetic (MAC 00:01:29:6a:b5:d6), 2026-10-14
    mac: "00:01:29:6a:b5:d6"
    os: Arch Linux (kernel 7.2.9-arch1-1)
    notes: >
      Connected to the Keenetic Omni II (LAN port 2) since 2026-10-14; the
      address is pinned by a DHCP reservation on the Keenetic (previously a
      reservation on the main router).
      Primary storage / media server. MiniDLNA, nginx reverse proxy. MinIO, SMB
      and NFS were removed on 2026-10-12 (see CHANGELOG). Jellyfin 10.11.6 ran as
      a Docker container (jellyfin/jellyfin:10.11.6), mounting
      /mnt/raid1/share/downloads — **migrated to k8s on 2026-10-13** (ns media,
      jellyfin.k8s.lan; container stopped and tower's nginx Jellyfin site
      disabled). Transmission moved to k8s on 2026-10-13 (ns media,
      transmission.k8s.lan); the tower system unit was already stopped+disabled.
      The media library /mnt/raid1/share/downloads is NFS-exported to the cluster
      (RWX) so Transmission and Jellyfin share the exact same files.
      Data array /mnt/raid1 — native mdadm RAID1 md0 (sdb+sdc, Toshiba N300
      HDWG440 4 TB, metadata 1.0, internal bitmap); converted from Intel IMSM
      fakeraid 2026-10-13 (see CHANGELOG).
      Historically was 192.168.1.200 before the move to the .30 subnet.
      Since 2026-10-13 also the cluster storage appliance (СХД): NFSv4 export
      /mnt/raid1/k8s-nfs (RWX), an iSCSI LIO target iqn.2026-10.lan.tower:k8s
      (RWO, fileio LUN on /mnt/raid1/k8s-iscsi), **Garage S3** (:3900, a Docker
      container with data_dir /mnt/raid1/garage — no iSCSI LUN), and **Postgres**
      (:5432, Docker, data_dir /mnt/raid1/postgres — serves the cluster's apps,
      e.g. Keycloak). Stateful services run here, k8s runs apps (ADR-0002).
      Configured by the Ansible role tower_storage; see docs/storage/.
    services:
      - {port: 22, proto: tcp, service: ssh}
      - {port: 80, proto: tcp, service: "nginx 1.30.5 (webserver; Jellyfin proxy site disabled)"}
      - {port: 2049, proto: tcp, service: "NFSv4 server — exports /mnt/raid1/k8s-nfs (RWX) and /mnt/raid1/share/downloads (media library) -> k8s"}
      - {port: 3260, proto: tcp, service: "iSCSI LIO target iqn.2026-10.lan.tower:k8s (configfs)"}
      - {port: 3900, proto: tcp, service: "Garage S3 API (object storage; Docker, host network)"}
      - {port: 5432, proto: tcp, service: "Postgres 18.6 (cluster apps — Keycloak; Docker)"}
    disabled_services:
      - "MiniDLNA (8200) — stopped + disabled 2026-10-13"
      - "Jellyfin (8096) — Docker container stopped 2026-10-13; migrated to k8s (ns media, jellyfin.k8s.lan)"
    removed_services:
      - "MinIO (9000/9001) — container+image+data removed 2026-10-12"
      - "SMB (139/445) — samba uninstalled 2026-10-12"
      - "NFS — nfs-utils removed 2026-10-12; NFSv4 server re-added 2026-10-13 for the cluster (/mnt/raid1/k8s-nfs + media library)"
      - "Transmission (9091) — tower system unit stopped+disabled 2026-10-13; migrated to k8s (ns media)"
    access: "ssh / http://tower.lan / http://192.168.30.200"

  - id: proxmox
    role: hypervisor
    status: up
    hostname: pve.lan
    ips:
      servers: 192.168.30.201
    os: Proxmox VE 8.4.21 (kernel 6.8.12-43-pve)
    notes: >
      Connected to the Keenetic Omni II (LAN port 3, VLAN30 tagged on vmbr0.30)
      since 2026-10-14; the Keenetic bridges VLAN30 into the 192.168.30.0/24
      segment. Management stays static 192.168.30.201.
      Proxmox VE host. Web UI on :8006, SPICE proxy on :3128. Single NVMe
      (Samsung SSD 980 1TB) on LVM-thin, no ZFS, no cluster.
      VMs: k8s-node-1..4 (101-104, 4 GB each, VLAN 120, onboot) — only these
      remain after 2026-10-12 (xminer/win10/ubuntu-cloud destroyed).
      Admin user `arch` configured with ssh key + NOPASSWD sudo 2026-10-12.
      Pending: expired node SSL cert (2025-08-17), no vzdump backups,
      NVMe media errors.
    services:
      - {port: 22, proto: tcp, service: ssh}
      - {port: 111, proto: tcp, service: rpcbind}
      - {port: 3128, proto: tcp, service: "spiceproxy"}
      - {port: 8006, proto: tcp, service: "Proxmox VE web UI"}
    access: "https://192.168.30.201:8006 (credentials: external)"

  - id: dreame-vacuum
    role: iot-vacuum
    status: up
    hostname: dreame_vacuum_p2114o.lan
    ips:
      lan: 192.168.1.207
    mac: "5c:c5:63:e8:5b:aa"
    hardware_oui: "Hunan FN-Link Technology Limited (WiFi module)"
    notes: "Dreame robot vacuum. No open TCP ports."
    access: "n/a"

  - id: pixel-10
    role: client-phone
    status: up
    hostname: Pixel-10.lan
    ips:
      lan: 192.168.1.214
    mac: "02:76:37:23:21:13"   # locally administered (MAC randomization)
    notes: "Google Pixel phone. Ports 51692/64660 are transient app ports."
    access: "n/a"

  - id: keenetic-omni-2
    role: server-router + wireguard-client
    status: up
    hostname: OpenWrt
    ips:
      servers: 192.168.30.1
      lan_uplink: 192.168.1.216   # DHCP on the main router LAN (via its switch port 3)
      wireguard: 10.200.0.2
    mac: "e4:18:6b:5a:e1:39"
    hardware: ZyXEL Keenetic Omni II (KN-1410) — MediaTek MT7620N, 64 MB RAM
    os: OpenWrt 23.05.3 (ramips/mt7620)
    notes: >
      Reflashed to OpenWrt and brought online 2026-10-14. Now the **router for
      the server segment** (br-lan 192.168.30.1/24) and the home **WireGuard
      client** (10.200.0.2) to adminvps. Wi-Fi disabled. Installed:
      kmod-wireguard + wireguard-tools (overlay has only ~1.7 MB free).
      Switch: port 0 = WAN, ports 1-4 = LAN. WAN uplink is the main router's
      switch port 3 (now VLAN1/LAN, DHCP 192.168.1.216). Port 3 = proxmox, a
      **trunk** (VLAN30 + VLAN120 tagged): VLAN30 (eth0.30) is bridged into
      br-lan; VLAN120 (eth0.120) = 10.10.120.1, the k8s nodes' gateway (keeps
      k8s in its own L2). Port 2 = tower. Firewall rule Allow-Mgmt-WAN
      (tcp 22/80/443 from 192.168.0.0/16) plus wg0/k8s in the lan zone.
      2026-10-15: **DHCP server for VLAN120** — `dhcp.k8s` pool
      (10.10.120.100-.249) + static reservations `dhcp.k8s_node1..4` for the four
      node MACs (.101-.104). The cluster was offline before this: the nodes had
      no DHCP pool (see CHANGELOG). Also a `wan_to_lan` forwarding rule so the
      main LAN — which routes the server/cluster subnets to this router — can
      reach them. SSH key added to `/etc/dropbear/authorized_keys`. `rebind_domain`
      set for `k8s.lan` + `metoda.cc` (rebind protection was dropping the
      private-IP answers forwarded from the main router).
      Configured in place (no Ansible role yet — see open_questions).
    services:
      - {port: 22, proto: tcp, service: dropbear-ssh}
      - {port: 80, proto: tcp, service: luci-http}
      - {port: 443, proto: tcp, service: luci-https}
    access: "http://192.168.30.1 / ssh root@192.168.1.216 (WAN) — credentials: external"

  - id: adminvps
    role: public-vps + wireguard-server
    status: up
    hostname: 206564.com
    ips:
      public: 78.17.99.16
      wireguard: 10.200.0.1
    os: Ubuntu 24.04 LTS (kernel 6.8.0)
    hardware: VPS — 1 vCPU, 2 GB RAM, 15 GB disk (amd64)
    notes: >
      Public VPS (78.17.99.16), reachable from the internet, provided by a VPS
      host. It was already a personal proxy box: x-ui/Xray 3.2.6,
      hysteria-server (udp:443), danted SOCKS (tcp:1080). Since 2026-10-14 also
      the **WireGuard server** (wg0 10.200.0.1/24, udp 51820) with the Keenetic
      as its only peer (AllowedIPs route the home nets 192.168.30.0/24 and
      10.10.120.0/24). User `arch` with NOPASSWD sudo. Since 2026-10-15 runs
      **Traefik** (Docker Compose, v3.7.14; Ansible role `adminvps_traefik`) on
      :80/:443 with Let's Encrypt **HTTP-01**, fronting `cloud.` / `auth.`
      services at home (re-encrypt to ingress-nginx over the tunnel).
    services:
      - {port: 22, proto: tcp, service: ssh}
      - {port: 80, proto: tcp, service: "Traefik (Let's Encrypt HTTP-01 + :443 redirect)"}
      - {port: 1080, proto: tcp, service: danted SOCK5}
      - {port: 443, proto: tcp, service: "Traefik (public TLS — cloud../auth.metoda.cc -> ingress-nginx over WG)"}
      - {port: 443, proto: udp, service: hysteria}
      - {port: 51820, proto: udp, service: "WireGuard server (home tunnel)"}
    access: "ssh arch@78.17.99.16 (credentials: external)"

