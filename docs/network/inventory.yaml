# tower_cloud / network inventory
# Machine-readable source of truth. Keep this file in sync with reality.
# Re-generate/verify with: scripts/recon.sh
# Last verified: 2026-10-13 (see CHANGELOG.md)

meta:
  site: home
  documented_at: "2026-10-12"
  observed_from: archasus (192.168.1.204)
  method: passive discovery + read-only scans (see scripts/recon.sh)
  secrets: none stored here — credentials live outside the repo

subnets:
  - id: lan
    cidr: 192.168.1.0/24
    purpose: main LAN — workstations, phones, IoT
    gateway: 192.168.1.1
    dhcp: true
    dhcp_server: 192.168.1.1
  - id: servers
    cidr: 192.168.30.0/24
    purpose: server segment — NAS + hypervisor
    gateway: 192.168.30.1
    dhcp: false            # servers use static addressing (observed)
    routed_by: 192.168.1.1 # routed, not bridged, from LAN
  - id: lan_v6_ula
    cidr: fde7:823d:5636::/64
    purpose: IPv6 ULA advertised by the router via RA
    gateway: fde7:823d:5636::1

hosts:
  - id: router
    role: gateway-router
    status: up
    ips:
      lan: 192.168.1.1
      servers: 192.168.30.1
    mac: "c0:4a:00:fb:ff:71"
    hardware_oui: "TP-Link Technologies Co.,Ltd"
    os: OpenWrt (LuCI)
    os_version: "23.093.42704"
    notes: >
      OpenWrt on TP-Link hardware. Web UI (LuCI) on :80/:443, dropbear SSH on :22.
      Routes between 192.168.1.0/24 and 192.168.30.0/24 and does DHCP/DNS for the LAN.
      IPv6 ULA RA (fde7:823d:5636::/64). Zones: lan, wan, vlan110 (10.10.110.0/24),
      vlan120 (10.10.120.0/24), iot (192.168.20.0/24), srv (192.168.30.0/24).
      Firewall forwards vlan120 -> srv on 2049/3260/9000 (added 2026-10-13, role
      router_openwrt) so the k8s nodes can reach tower's storage.
      DNS (dnsmasq) serves a wildcard for cluster Ingress names: --address
      '/k8s.lan/<ip>' for all four node IPs (role router_openwrt, 2026-10-13) —
      any <name>.k8s.lan resolves to the ingress entry points. It also has
      static DHCP reservations for the k8s nodes (dhcp.@host[4..7]:
      10.10.120.101-104) so those IPs are stable.
    services:
      - {port: 22, proto: tcp, service: dropbear-ssh}
      - {port: 80, proto: tcp, service: luci-http}
      - {port: 443, proto: tcp, service: luci-https}
    access: "ssh root@192.168.1.1 / http://192.168.1.1  (credentials: external)"

  - id: archasus
    role: workstation
    status: up
    ips:
      lan: [192.168.1.204, 192.168.1.205]   # TWO IPv4 leases on one NIC — anomaly, see CHANGELOG
    mac: "fc:9d:05:72:97:da"
    os: Arch Linux (kernel 7.2.7-arch1-1)
    hardware: MSI MS-7D98, 1 GbE (enp3s0)
    notes: >
      This recon host. Docker host (containers: alisa-web, openwebui, postgres, ...).
      Local dev proxies: hiddify (SOCKS), ssh -D dynamic tunnel, ollama via ssh forward.
      (NFS client mount of tower:/srv/nfs/datasets was removed 2026-10-12.)
    services_localhost_only: [1080, 12334, 12336, 12337, 30000, 63342]
    access: "local"

  - id: tower
    role: nas-media-server
    status: up
    hostname: tower.lan
    ips:
      servers: 192.168.30.200
    mac: null
    os: Arch Linux (kernel 7.2.9-arch1-1)
    notes: >
      Primary storage / media server. MiniDLNA, nginx reverse proxy. MinIO, SMB
      and NFS were removed on 2026-10-12 (see CHANGELOG). Jellyfin 10.11.6 ran as
      a Docker container (jellyfin/jellyfin:10.11.6), mounting
      /mnt/raid1/share/downloads — **migrated to k8s on 2026-10-13** (ns media,
      jellyfin.k8s.lan; container stopped and tower's nginx Jellyfin site
      disabled). Transmission moved to k8s on 2026-10-13 (ns media,
      transmission.k8s.lan); the tower system unit was already stopped+disabled.
      The media library /mnt/raid1/share/downloads is NFS-exported to the cluster
      (RWX) so Transmission and Jellyfin share the exact same files.
      Data array /mnt/raid1 — native mdadm RAID1 md0 (sdb+sdc, Toshiba N300
      HDWG440 4 TB, metadata 1.0, internal bitmap); converted from Intel IMSM
      fakeraid 2026-10-13 (see CHANGELOG).
      Historically was 192.168.1.200 before the move to the .30 subnet.
      Since 2026-10-13 also the cluster storage appliance (СХД): NFSv4 export
      /mnt/raid1/k8s-nfs (RWX), an iSCSI LIO target iqn.2026-10.lan.tower:k8s
      (RWO, fileio LUN on /mnt/raid1/k8s-iscsi), **Garage S3** (:3900, a Docker
      container with data_dir /mnt/raid1/garage — no iSCSI LUN), and **Postgres**
      (:5432, Docker, data_dir /mnt/raid1/postgres — serves the cluster's apps,
      e.g. Keycloak). Stateful services run here, k8s runs apps (ADR-0002).
      Configured by the Ansible role tower_storage; see docs/storage/.
    services:
      - {port: 22, proto: tcp, service: ssh}
      - {port: 80, proto: tcp, service: "nginx 1.30.5 (webserver; Jellyfin proxy site disabled)"}
      - {port: 2049, proto: tcp, service: "NFSv4 server — exports /mnt/raid1/k8s-nfs (RWX) and /mnt/raid1/share/downloads (media library) -> k8s"}
      - {port: 3260, proto: tcp, service: "iSCSI LIO target iqn.2026-10.lan.tower:k8s (configfs)"}
      - {port: 3900, proto: tcp, service: "Garage S3 API (object storage; Docker, host network)"}
      - {port: 5432, proto: tcp, service: "Postgres 18.6 (cluster apps — Keycloak; Docker)"}
    disabled_services:
      - "MiniDLNA (8200) — stopped + disabled 2026-10-13"
      - "Jellyfin (8096) — Docker container stopped 2026-10-13; migrated to k8s (ns media, jellyfin.k8s.lan)"
    removed_services:
      - "MinIO (9000/9001) — container+image+data removed 2026-10-12"
      - "SMB (139/445) — samba uninstalled 2026-10-12"
      - "NFS — nfs-utils removed 2026-10-12; NFSv4 server re-added 2026-10-13 for the cluster (/mnt/raid1/k8s-nfs + media library)"
      - "Transmission (9091) — tower system unit stopped+disabled 2026-10-13; migrated to k8s (ns media)"
    access: "ssh / http://tower.lan / http://192.168.30.200"

  - id: proxmox
    role: hypervisor
    status: up
    hostname: pve.lan
    ips:
      servers: 192.168.30.201
    os: Proxmox VE 8.4.21 (kernel 6.8.12-43-pve)
    notes: >
      Proxmox VE host. Web UI on :8006, SPICE proxy on :3128. Single NVMe
      (Samsung SSD 980 1TB) on LVM-thin, no ZFS, no cluster.
      VMs: k8s-node-1..4 (101-104, 4 GB each, VLAN 120, onboot) — only these
      remain after 2026-10-12 (xminer/win10/ubuntu-cloud destroyed).
      Admin user `arch` configured with ssh key + NOPASSWD sudo 2026-10-12.
      Pending: expired node SSL cert (2025-08-17), no vzdump backups,
      NVMe media errors.
    services:
      - {port: 22, proto: tcp, service: ssh}
      - {port: 111, proto: tcp, service: rpcbind}
      - {port: 3128, proto: tcp, service: "spiceproxy"}
      - {port: 8006, proto: tcp, service: "Proxmox VE web UI"}
    access: "https://192.168.30.201:8006 (credentials: external)"

  - id: dreame-vacuum
    role: iot-vacuum
    status: up
    hostname: dreame_vacuum_p2114o.lan
    ips:
      lan: 192.168.1.207
    mac: "5c:c5:63:e8:5b:aa"
    hardware_oui: "Hunan FN-Link Technology Limited (WiFi module)"
    notes: "Dreame robot vacuum. No open TCP ports."
    access: "n/a"

  - id: pixel-10
    role: client-phone
    status: up
    hostname: Pixel-10.lan
    ips:
      lan: 192.168.1.214
    mac: "02:76:37:23:21:13"   # locally administered (MAC randomization)
    notes: "Google Pixel phone. Ports 51692/64660 are transient app ports."
    access: "n/a"

  - id: keenetic-omni-2
    role: router-spare
    status: offline
    ips: {}
    hardware: Keenetic Omni 2 (KN-1410)
    notes: >
      Spare router, currently offline / not on the network. Intended role unknown
      (AP? backup WAN? separate LAN? OpenWrt target?). See open_questions.

