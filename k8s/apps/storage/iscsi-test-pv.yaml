apiVersion: v1
kind: PersistentVolume
metadata:
  name: tower-iscsi-vol1
  labels:
    app: iscsi-smoke
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  iscsi:
    targetPortal: 192.168.30.200:3260
    iqn: iqn.2026-10.lan.tower:k8s
    lun: 0
    fsType: ext4
    readOnly: false
