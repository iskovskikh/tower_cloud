# Garage cluster secrets (rpc_secret, admin_token) live in Vault at secret/garage
# (created out-of-band). ESO renders the full garage.toml, so no secret values
# are stored in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-config
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: garage-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        garage.toml: |
          metadata_dir = "/var/lib/garage/meta"
          data_dir     = "/var/lib/garage/data"
          db_engine    = "sqlite"

          replication_factor = 1

          rpc_bind_addr   = "[::]:3901"
          rpc_public_addr = "[::]:3901"
          rpc_secret      = "{{ .rpc_secret }}"

          [s3_api]
          s3_region     = "garage"
          api_bind_addr = "[::]:3900"
          root_domain   = ".s3.garage.localhost"

          [s3_web]
          bind_addr   = "[::]:3902"
          root_domain = ".web.garage.localhost"

          [admin]
          api_bind_addr = "[::]:3903"
          admin_token   = "{{ .admin_token }}"
  data:
    - secretKey: rpc_secret
      remoteRef:
        key: garage
        property: rpc_secret
    - secretKey: admin_token
      remoteRef:
        key: garage
        property: admin_token
