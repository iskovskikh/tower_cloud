# S3 object store backing data: dedicated iSCSI LUN on tower (backstore
# "garage" = lun 2).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tower-iscsi-garage
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: tower-iscsi-static
  iscsi:
    targetPortal: 192.168.30.200:3260
    iqn: iqn.2026-10.lan.tower:k8s
    lun: 2
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: garage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tower-iscsi-static
  volumeName: tower-iscsi-garage
  resources:
    requests:
      storage: 50Gi
