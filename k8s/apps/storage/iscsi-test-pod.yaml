apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tower-iscsi-test
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: tower-iscsi-vol1
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: iscsi-test
  namespace: default
  labels:
    app: iscsi-smoke
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo hello-from-pod > /data/test.txt; sync; sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: tower-iscsi-test
  restartPolicy: Never
