# Bootstrap realm "tower" imported by Keycloak on first start (--import-realm).
#
# No secrets live here: Keycloak substitutes ${VAR} placeholders from the
# container environment (fed by the keycloak-secrets ExternalSecret). NOTE: import only
# applies to realms that do not exist yet — later realm changes must be applied
# through the admin console/API (realm-as-code is a follow-up).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: keycloak
data:
  tower-realm.json: |
    {
      "realm": "tower",
      "enabled": true,
      "displayName": "tower cloud",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "accessTokenLifespan": 3600,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "roles": {
        "realm": [
          { "name": "admin" },
          { "name": "user" },
          { "name": "opencloudAdmin", "description": "OpenCloud administrator" },
          { "name": "opencloudSpaceAdmin", "description": "OpenCloud space administrator" },
          { "name": "opencloudUser", "description": "OpenCloud user" },
          { "name": "opencloudGuest", "description": "OpenCloud guest" }
        ]
      },
      "groups": [
        { "name": "admins" },
        { "name": "users" }
      ],
      "clients": [
        {
          "clientId": "vault",
          "name": "Vault",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${VAULT_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://vault.k8s.lan/ui/vault/auth/oidc/oidc/callback",
            "http://localhost:8250/oidc/callback"
          ],
          "webOrigins": [
            "https://vault.k8s.lan"
          ],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "vault",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "oauth2-proxy",
          "name": "oauth2-proxy",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${OAUTH2_PROXY_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://auth.k8s.lan/oauth2/callback"
          ],
          "webOrigins": [
            "https://auth.k8s.lan"
          ],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "oauth2-proxy",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "web",
          "name": "OpenCloud Web App",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "rootUrl": "https://cloud.metoda.cc",
          "adminUrl": "https://cloud.metoda.cc",
          "redirectUris": [
            "https://cloud.metoda.cc/",
            "https://cloud.metoda.cc/oidc-callback.html",
            "https://cloud.metoda.cc/oidc-silent-redirect.html",
            "https://opencloud.k8s.lan/",
            "https://opencloud.k8s.lan/oidc-callback.html",
            "https://opencloud.k8s.lan/oidc-silent-redirect.html"
          ],
          "webOrigins": [
            "https://cloud.metoda.cc",
            "https://opencloud.k8s.lan"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "+",
            "backchannel.logout.url": "https://cloud.metoda.cc/backchannel_logout",
            "backchannel.logout.session.required": "true"
          },
          "defaultClientScopes": [
            "opencloud-roles", "web-origins", "profile", "roles", "basic", "email"
          ],
          "optionalClientScopes": [
            "address", "phone", "offline_access", "microprofile-jwt"
          ]
        },
        {
          "clientId": "OpenCloudDesktop",
          "name": "OpenCloud Desktop Client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://127.0.0.1",
            "http://localhost"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "+"
          },
          "defaultClientScopes": [
            "opencloud-roles", "web-origins", "profile", "roles", "basic", "email"
          ],
          "optionalClientScopes": [
            "address", "phone", "offline_access", "microprofile-jwt"
          ]
        },
        {
          "clientId": "OpenCloudAndroid",
          "name": "OpenCloud Android App",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "oc://android.opencloud.eu"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "oc://android.opencloud.eu"
          },
          "defaultClientScopes": [
            "opencloud-roles", "web-origins", "profile", "roles", "basic", "email"
          ],
          "optionalClientScopes": [
            "address", "phone", "offline_access", "microprofile-jwt"
          ]
        },
        {
          "clientId": "OpenCloudIOS",
          "name": "OpenCloud iOS App",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "oc://ios.opencloud.eu"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "oc://ios.opencloud.eu"
          },
          "defaultClientScopes": [
            "opencloud-roles", "web-origins", "profile", "roles", "basic", "email"
          ],
          "optionalClientScopes": [
            "address", "phone", "offline_access", "microprofile-jwt"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "opencloud-roles",
          "description": "Realm roles as a flat, multi-valued `roles` claim (OpenCloud)",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "realm roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "userinfo.token.claim": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "roles",
                "jsonType.label": "String"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "${KEYCLOAK_DEMO_USER}",
          "enabled": true,
          "email": "${KEYCLOAK_DEMO_USER}@k8s.lan",
          "emailVerified": true,
          "firstName": "Andrey",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "${KEYCLOAK_DEMO_USER_PASSWORD}",
              "temporary": false
            }
          ],
          "groups": [
            "/users"
          ],
          "realmRoles": [
            "user"
          ]
        },
        {
          "username": "aiskovskikh",
          "enabled": true,
          "email": "aiskovskikh@k8s.lan",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "${KEYCLOAK_AISKOVSKIKH_PASSWORD}",
              "temporary": true
            }
          ],
          "groups": [
            "/users"
          ],
          "realmRoles": [
            "user",
            "opencloudAdmin"
          ]
        },
        {
          "username": "niskovskikh",
          "enabled": true,
          "email": "niskovskikh@metoda.cc",
          "emailVerified": false,
          "firstName": "N",
          "lastName": "Isk",
          "credentials": [
            {
              "type": "password",
              "value": "${KEYCLOAK_NISKOVSKIKH_PASSWORD}",
              "temporary": true
            }
          ],
          "groups": [
            "/users"
          ],
          "realmRoles": [
            "opencloudUser"
          ]
        },
        {
          "username": "viskovskikh",
          "enabled": true,
          "email": "viskovskikh@metoda.cc",
          "emailVerified": false,
          "firstName": "V",
          "lastName": "Isk",
          "credentials": [
            {
              "type": "password",
              "value": "${KEYCLOAK_VISKOVSKIKH_PASSWORD}",
              "temporary": true
            }
          ],
          "groups": [
            "/users"
          ],
          "realmRoles": [
            "opencloudUser"
          ]
        }
      ]
    }
