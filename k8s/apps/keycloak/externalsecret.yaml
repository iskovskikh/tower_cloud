# All Keycloak credentials live in Vault at secret/keycloak (generated by the
# Ansible role vault_config; never in git). One Secret feeds both Postgres and
# Keycloak. The OIDC client secrets are referenced by the Keycloak realm import
# through ${env.*} substitution, so the realm JSON stays secret-free.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef: { key: keycloak, property: db_password }
    - secretKey: admin-username
      remoteRef: { key: keycloak, property: admin_username }
    - secretKey: admin-password
      remoteRef: { key: keycloak, property: admin_password }
    - secretKey: oauth2-proxy-client-secret
      remoteRef: { key: keycloak, property: oauth2_proxy_client_secret }
    - secretKey: oauth2-proxy-cookie-secret
      remoteRef: { key: keycloak, property: oauth2_proxy_cookie_secret }
    - secretKey: vault-client-secret
      remoteRef: { key: keycloak, property: vault_client_secret }
    - secretKey: demo-user
      remoteRef: { key: keycloak, property: demo_user }
    - secretKey: demo-user-password
      remoteRef: { key: keycloak, property: demo_user_password }
    - secretKey: aiskovskikh-password
      remoteRef: { key: keycloak, property: aiskovskikh_password }
    - secretKey: niskovskikh-password
      remoteRef: { key: keycloak, property: niskovskikh_password }
    - secretKey: viskovskikh-password
      remoteRef: { key: keycloak, property: viskovskikh_password }
