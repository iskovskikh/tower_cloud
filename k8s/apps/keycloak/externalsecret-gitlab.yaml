# GitLab's Keycloak client secret, mirrored into the keycloak namespace so the
# realm bootstrap can substitute ${GITLAB_OIDC_CLIENT_SECRET} and the
# keycloak_config Ansible role can reconcile the client.
#
# Kept separate from keycloak-secrets so a missing/misconfigured Vault
# secret/gitlab cannot block Keycloak's own credentials from syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-gitlab-oidc
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: keycloak-gitlab-oidc
    creationPolicy: Owner
    template:
      data:
        GITLAB_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  data:
    - secretKey: oidc_client_secret
      remoteRef: { key: gitlab, property: oidc_client_secret }
