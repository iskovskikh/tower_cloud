apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    cert-manager.io/cluster-issuer: tower-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - keycloak.k8s.lan   # internal (split-horizon) name
        - auth.metoda.cc      # public name, fronted by Traefik on adminvps
      secretName: keycloak-tls
  rules:
    - host: keycloak.k8s.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    - host: auth.metoda.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
