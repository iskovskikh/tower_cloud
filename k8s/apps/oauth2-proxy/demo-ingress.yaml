# Example of protecting an arbitrary Ingress with SSO: the three auth-* /
# auth-signin annotations route unauthenticated users through Keycloak.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: oauth2-proxy
  annotations:
    cert-manager.io/cluster-issuer: tower-ca
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.k8s.lan/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "x-auth-request-user, x-auth-request-email"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - whoami.k8s.lan
      secretName: whoami-tls
  rules:
    - host: whoami.k8s.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
