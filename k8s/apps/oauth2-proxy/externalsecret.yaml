# oauth2-proxy credentials, from the same Vault path as Keycloak (secret/keycloak).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secrets
  namespace: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: oauth2-proxy-secrets
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: { key: keycloak, property: oauth2_proxy_client_secret }
    - secretKey: cookie-secret
      remoteRef: { key: keycloak, property: oauth2_proxy_cookie_secret }
