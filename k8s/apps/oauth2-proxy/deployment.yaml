# Forward-auth provider (external auth) for ingress-nginx. Protect any Ingress
# with:
#   nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth"
#   nginx.ingress.kubernetes.io/auth-signin: "https://auth.k8s.lan/oauth2/start?rd=$scheme://$host$request_uri"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.k8s.lan/realms/tower
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --upstream=static://202
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --set-authorization-header=true
            - --skip-provider-button=true
            # TLS to Keycloak is the internal CA, not mounted here: skip verify.
            - --ssl-insecure-skip-verify=true
            - --cookie-secure=true
            # Share the session cookie across all protected *.k8s.lan hosts.
            - --cookie-domain=.k8s.lan
            - --whitelist-domain=.k8s.lan
            # Transmission's RPC API is reached by non-browser clients; let it
            # through to the app, which enforces its own basic auth (USER/PASS).
            - --skip-auth-route=^/transmission/rpc
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: oauth2-proxy
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
