apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # No cloud LoadBalancer here: run as a hostNetwork DaemonSet so the
    # controller listens on every node's :80/:443 (any node IP is an entry point).
    controller:
      kind: DaemonSet
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      service:
        type: ClusterIP
      publishService:
        enabled: false
      reportNodeInternalIp: true
      ingressClassResource:
        default: true
    defaultBackend:
      enabled: false
