apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # No cloud LoadBalancer here: run as a hostNetwork DaemonSet so the
    # controller listens on every node's :80/:443 (any node IP is an entry point).
    controller:
      kind: DaemonSet
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      service:
        type: ClusterIP
      publishService:
        enabled: false
      reportNodeInternalIp: true
      ingressClassResource:
        default: true
      # Also run on the control-plane node: every node becomes an ingress entry
      # point, so the wildcard DNS *.k8s.lan can resolve to all four node IPs.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    defaultBackend:
      enabled: false
