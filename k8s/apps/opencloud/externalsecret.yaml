# Initial admin password for the built-in IDM admin user, from Vault at
# secret/opencloud (created out-of-band, e.g.:
#   vault kv put secret/opencloud admin_password="$(openssl rand -base64 24)").
# IDM_ADMIN_PASSWORD is only honoured on the very first start — afterwards it
# must be changed through the OpenCloud UI/CLI.
#
# S3_ACCESS_KEY / S3_SECRET_KEY are the Garage (S3) credentials for the
# decomposeds3 storage driver (bucket "opencloud"), also stored in Vault at
# secret/opencloud.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-secrets
  namespace: opencloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: opencloud-secrets
    creationPolicy: Owner
  data:
    - secretKey: IDM_ADMIN_PASSWORD
      remoteRef:
        key: opencloud
        property: admin_password
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: opencloud
        property: s3_access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: opencloud
        property: s3_secret_key
