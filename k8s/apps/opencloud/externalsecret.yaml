# Secrets for OpenCloud, from Vault at secret/opencloud.
#
# Two groups:
#   * S3_ACCESS_KEY / S3_SECRET_KEY — Garage credentials for the decomposeds3
#     storage driver (bucket "opencloud"), consumed by STORAGE_USERS_DECOMPOSEDS3_*.
#   * OCCFG_* — values substituted into opencloud.yaml (see
#     configmap-opencloud.yaml). They replace what `opencloud init` used to
#     generate, so they MUST be stable for the life of the installation; the
#     bind passwords also have to match the embedded IDM on the data LUN.
#
# Load them out-of-band (never commit values), e.g.:
#   vault kv put secret/opencloud \
#     jwt_secret=... machine_auth_api_key=... system_user_api_key=... \
#     transfer_secret=... url_signing_secret=... idm_bind_password=... \
#     service_account_secret=... idp_bind_password=... admin_password=... \
#     reva_bind_password=... wopi_secret=... thumbnail_transfer_secret=...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-secrets
  namespace: opencloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: opencloud-secrets
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: opencloud
        property: s3_access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: opencloud
        property: s3_secret_key
    - secretKey: OCCFG_JWT_SECRET
      remoteRef:
        key: opencloud
        property: jwt_secret
    - secretKey: OCCFG_MACHINE_AUTH_API_KEY
      remoteRef:
        key: opencloud
        property: machine_auth_api_key
    - secretKey: OCCFG_SYSTEM_USER_API_KEY
      remoteRef:
        key: opencloud
        property: system_user_api_key
    - secretKey: OCCFG_TRANSFER_SECRET
      remoteRef:
        key: opencloud
        property: transfer_secret
    - secretKey: OCCFG_URL_SIGNING_SECRET
      remoteRef:
        key: opencloud
        property: url_signing_secret
    - secretKey: OCCFG_IDM_BIND_PASSWORD
      remoteRef:
        key: opencloud
        property: idm_bind_password
    - secretKey: OCCFG_SERVICE_ACCOUNT_SECRET
      remoteRef:
        key: opencloud
        property: service_account_secret
    - secretKey: OCCFG_IDP_BIND_PASSWORD
      remoteRef:
        key: opencloud
        property: idp_bind_password
    - secretKey: OCCFG_ADMIN_PASSWORD
      remoteRef:
        key: opencloud
        property: admin_password
    - secretKey: OCCFG_REVA_BIND_PASSWORD
      remoteRef:
        key: opencloud
        property: reva_bind_password
    - secretKey: OCCFG_WOPI_SECRET
      remoteRef:
        key: opencloud
        property: wopi_secret
    - secretKey: OCCFG_THUMBNAIL_TRANSFER_SECRET
      remoteRef:
        key: opencloud
        property: thumbnail_transfer_secret
