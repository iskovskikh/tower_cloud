apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app: opencloud
spec:
  replicas: 1
  # Single instance with an embedded IDM/storage engine — never run two pods
  # against the same data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      # The image runs as uid/gid 1000 (see docker-compose `user: 1000:1000`);
      # fsGroup keeps the freshly provisioned NFS dirs writable.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # `opencloud init` generates /etc/opencloud/opencloud.yaml with random
      # secrets and seeds the embedded LDAP admin. It fails harmlessly once the
      # config already exists (as in the reference compose command), so the
      # failure is swallowed and `server` starts either way.
      initContainers:
        - name: init
          image: opencloudeu/opencloud:7.2.4
          command:
            - /bin/sh
            - -c
            - opencloud init || true
          env:
            # init reads these too: without OC_INSECURE it prompts interactively
            # ("configure OpenCloud with certificate checking disabled?") and
            # loops forever, since there is no TTY.
            - name: OC_URL
              value: "https://cloud.metoda.cc"
            - name: OC_INSECURE
              value: "true"
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: IDM_ADMIN_PASSWORD
            # DecomposedS3: user blobs live in Garage (S3); metadata + the
            # embedded IDM stay on the local block volume (needs xattrs).
            - name: STORAGE_USERS_DRIVER
              value: decomposeds3
            - name: STORAGE_SYSTEM_DRIVER
              value: decomposed
            - name: STORAGE_USERS_DECOMPOSEDS3_ENDPOINT
              value: "http://192.168.30.200:3900"
            - name: STORAGE_USERS_DECOMPOSEDS3_REGION
              value: garage
            - name: STORAGE_USERS_DECOMPOSEDS3_BUCKET
              value: opencloud
            - name: STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: S3_ACCESS_KEY
            - name: STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
      containers:
        - name: opencloud
          image: opencloudeu/opencloud:7.2.4
          env:
            # External URL baked into config.json, the OIDC issuer, webfinger
            # and every generated link. Must be the name the browser uses:
            # clients bootstrap against `server`/webfinger, so the public host
            # (not opencloud.k8s.lan) — router dnsmasq answers it with the
            # ingress-nginx node IPs on the LAN (split horizon).
            - name: OC_URL
              value: "https://cloud.metoda.cc"
            # nginx terminates TLS; the OpenCloud proxy serves plain HTTP.
            - name: PROXY_TLS
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            # Self-signed internal CA (tower-ca) is not in the image trust store.
            - name: OC_INSECURE
              value: "true"
            # No public demo accounts.
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            # Only honoured on the first start (init), see externalsecret.yaml.
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: IDM_ADMIN_PASSWORD
            # --- external OIDC identity provider: Keycloak (realm "tower") ---
            # SSO: the browser/apps authenticate against Keycloak, not the
            # built-in IDP. Only `idp` is excluded — the built-in `idm` (embedded
            # LDAP on the tower LUN) is kept and stores the autoprovisioned users
            # (the "smaller setup" option from the OpenCloud docs, no extra LDAP).
            - name: OC_EXCLUDE_RUN_SERVICES
              value: "idp"
            - name: OC_OIDC_ISSUER
              value: "https://auth.metoda.cc/realms/tower"
            - name: IDP_DOMAIN
              value: "auth.metoda.cc"
            - name: IDP_ISSUER_URL
              value: "https://auth.metoda.cc/realms/tower"
            # Serve Keycloak's .well-known/openid-configuration on the base URL.
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            # Verify access tokens as JWTs against Keycloak's signing keys.
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: "jwt"
            # Just-in-time provisioning of OpenCloud accounts from Keycloak
            # claims on first login; the Keycloak username is the OpenCloud
            # username (see PROXY_USER_OIDC_CLAIM / AUTOPROVISION below).
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_USER_OIDC_CLAIM
              value: "preferred_username"
            - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
              value: "preferred_username"
            - name: PROXY_USER_CS3_CLAIM
              value: "username"
            # Roles come from the flat `roles` claim that the Keycloak client
            # scope `opencloud-roles` adds (opencloudAdmin/-SpaceAdmin/-User/-Guest).
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "oidc"
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: "roles"
            # Admin is role-based; there is no fixed admin user id.
            - name: OC_ADMIN_USER_ID
              value: ""
            - name: SETTINGS_SETUP_DEFAULT_ASSIGNMENTS
              value: "false"
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            - name: GRAPH_USERNAME_MATCH
              value: "none"
            # The built-in LDAP must be writable so autoprovisioning can create users.
            - name: OC_LDAP_SERVER_WRITE_ENABLED
              value: "true"
            - name: FRONTEND_READONLY_USER_ATTRIBUTES
              value: "user.onPremisesSamAccountName,user.displayName,user.mail,user.passwordProfile,user.memberOf"
            # "Edit account" in the OpenCloud UI points at the Keycloak account console.
            - name: WEB_OPTION_ACCOUNT_EDIT_LINK_HREF
              value: "https://auth.metoda.cc/realms/tower/account"
            # DecomposedS3: user blobs live in Garage (S3); metadata + the
            # embedded IDM stay on the local block volume (needs xattrs).
            - name: STORAGE_USERS_DRIVER
              value: decomposeds3
            - name: STORAGE_SYSTEM_DRIVER
              value: decomposed
            - name: STORAGE_USERS_DECOMPOSEDS3_ENDPOINT
              value: "http://192.168.30.200:3900"
            - name: STORAGE_USERS_DECOMPOSEDS3_REGION
              value: garage
            - name: STORAGE_USERS_DECOMPOSEDS3_BUCKET
              value: opencloud
            - name: STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: S3_ACCESS_KEY
            - name: STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: S3_SECRET_KEY
            - name: OC_LOG_LEVEL
              value: "info"
            - name: OC_LOG_PRETTY
              value: "false"
            - name: FRONTEND_ARCHIVER_MAX_SIZE
              value: "10000000000"
            - name: TZ
              value: "Europe/Moscow"
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
