# OpenCloud global config (opencloud.yaml), declarative instead of generated by
# `opencloud init`. Previously init wrote this file (with random secrets and
# installation IDs) into a /etc/opencloud PVC. Now it is versioned here and the
# secrets are injected from the environment at load time:
#
#   * non-secret values and the installation IDs (system/admin user id,
#     graph.application.id, mount ids, service_account_id) are pinned below;
#   * every secret is a bash-substitution placeholder `${OCCFG_*}`, expanded by
#     OpenCloud from env vars (see the `opencloud-secrets` ExternalSecret and
#     `envFrom` in deployment.yaml). Same mechanism as csp.yaml.
#
# WARNING: the pinned IDs belong to this installation's embedded IDM and the
# metadata on the opencloud-data LUN. Do NOT reuse this file after wiping /
# rebuilding that LUN without re-running `opencloud init` — the IDs and bind
# passwords would no longer match a fresh IDM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-yaml
  namespace: opencloud
  labels:
    app: opencloud
data:
  opencloud.yaml: |
    token_manager:
      jwt_secret: "${OCCFG_JWT_SECRET}"
    machine_auth_api_key: "${OCCFG_MACHINE_AUTH_API_KEY}"
    system_user_api_key: "${OCCFG_SYSTEM_USER_API_KEY}"
    transfer_secret: "${OCCFG_TRANSFER_SECRET}"
    url_signing_secret: "${OCCFG_URL_SIGNING_SECRET}"
    system_user_id: edc8b0d2-0006-46a7-a10f-b27f0fcf83bf
    admin_user_id: f4c9593a-4c94-4043-97f1-37076eddab96
    graph:
      application:
        id: 349f56b2-4154-4fe4-9155-d0401c336e47
      events:
        tls_insecure: true
      spaces:
        insecure: true
      identity:
        ldap:
          bind_password: "${OCCFG_IDM_BIND_PASSWORD}"
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    idp:
      ldap:
        bind_password: "${OCCFG_IDP_BIND_PASSWORD}"
    idm:
      service_user_passwords:
        admin_password: "${OCCFG_ADMIN_PASSWORD}"
        idm_password: "${OCCFG_IDM_BIND_PASSWORD}"
        reva_password: "${OCCFG_REVA_BIND_PASSWORD}"
        idp_password: "${OCCFG_IDP_BIND_PASSWORD}"
    collaboration:
      wopi:
        secret: "${OCCFG_WOPI_SECRET}"
      app:
        insecure: true
    proxy:
      oidc:
        insecure: true
      insecure_backends: true
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    frontend:
      app_handler:
        insecure: true
      archiver:
        insecure: true
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
      ocdav:
        insecure: true
    auth_basic:
      auth_providers:
        ldap:
          bind_password: "${OCCFG_REVA_BIND_PASSWORD}"
    auth_bearer:
      auth_providers:
        oidc:
          insecure: true
    users:
      drivers:
        ldap:
          bind_password: "${OCCFG_REVA_BIND_PASSWORD}"
    groups:
      drivers:
        ldap:
          bind_password: "${OCCFG_REVA_BIND_PASSWORD}"
    ocm:
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    thumbnails:
      thumbnail:
        transfer_secret: "${OCCFG_THUMBNAIL_TRANSFER_SECRET}"
        webdav_allow_insecure: true
        cs3_allow_insecure: true
    search:
      events:
        tls_insecure: true
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    audit:
      events:
        tls_insecure: true
    settings:
      service_account_ids:
      - 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
    sharing:
      events:
        tls_insecure: true
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    storage_users:
      events:
        tls_insecure: true
      mount_id: 18e7c45f-f8df-41eb-aaef-b89caa7b4186
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    notifications:
      notifications:
        events:
          tls_insecure: true
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    nats:
      nats:
        tls_skip_verify_client_cert: true
    gateway:
      storage_registry:
        storage_users_mount_id: 18e7c45f-f8df-41eb-aaef-b89caa7b4186
    userlog:
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    auth_service:
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    clientlog:
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
    activitylog:
      service_account:
        service_account_id: 2239e63a-a5e7-4bb7-96f6-9894e5e9eb16
        service_account_secret: "${OCCFG_SERVICE_ACCOUNT_SECRET}"
