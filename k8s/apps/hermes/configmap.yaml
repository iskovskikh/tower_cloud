# Hermes home config. Mounted read-only at /opt/data/config.yaml; everything
# else under /opt/data (sessions, skills, .env, secrets) lives on the PVC.
#
# The dashboard is exposed publicly through adminvps, so it runs in gated mode
# and logs in via Keycloak (self-hosted OIDC provider). The `hermes` Keycloak
# client is public with PKCE and redirects to
# https://hermes.metoda.cc/auth/callback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    # Pin the schema so the container does not try to rewrite this read-only
    # ConfigMap mount on every boot.
    _config_version: 51

    model:
      provider: deepseek
      default: deepseek-chat

    gateway:
      # One bot, several profiles. Match order: user_id > thread_id > chat_id.
      # The mitya profile lives on the PVC at /opt/data/profiles/mitya.
      profile_routes:
        - name: mitya
          platform: telegram
          user_id: "116189066"
          chat_id: "116189066"
          profile: mitya
          enabled: true

    dashboard:
      public_url: "https://hermes.metoda.cc"
      # ingress-nginx runs hostNetwork on the four cluster nodes; trust only
      # those peers so X-Forwarded-Proto (Secure cookies) and X-Forwarded-For
      # (real client IPs) are accepted.
      trusted_proxies:
        - "10.10.120.101"
        - "10.10.120.102"
        - "10.10.120.103"
        - "10.10.120.104"
      oauth:
        provider: self-hosted
        self_hosted:
          issuer: "https://auth.metoda.cc/realms/tower"
          client_id: hermes
          scopes: "openid profile email"
