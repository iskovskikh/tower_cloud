# Hermes credentials from Vault `secret/hermes`:
#   deepseek_api_key, telegram_bot_token, telegram_allowed_users
#
# Populate them once (never commit the values):
#   vault kv put secret/hermes \
#     deepseek_api_key=... \
#     telegram_bot_token=... \
#     telegram_allowed_users=123456789
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    - secretKey: DEEPSEEK_API_KEY
      remoteRef: { key: hermes, property: deepseek_api_key }
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef: { key: hermes, property: telegram_bot_token }
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef: { key: hermes, property: telegram_allowed_users }
