# SSH key Hermes uses to reach archasus (the Ansible/ops workstation).
# Kept separate from hermes-secrets so the private key is mounted as a file
# and never injected into the container environment.
#
# Vault `secret/hermes`:
#   archasus_ssh_key          (private key, ed25519)
#   archasus_ssh_known_hosts  (pinned archasus host key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-ssh
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: hermes-ssh
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef: { key: hermes, property: archasus_ssh_key }
    - secretKey: known_hosts
      remoteRef: { key: hermes, property: archasus_ssh_known_hosts }
