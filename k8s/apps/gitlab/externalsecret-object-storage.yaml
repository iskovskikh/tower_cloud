# GitLab consolidated object storage -> Garage S3 on tower (:3900).
#
# The chart mounts this Secret's `config` key as
# /etc/gitlab/objectstorage/object_store and loads it as the `connection`
# settings shared by artifacts, LFS, uploads and packages. `proxy_download` is
# left on in the HelmRelease, so clients never talk to Garage directly.
#
# Buckets are created by the `tower_storage` Ansible role; their names match the
# HelmRelease values (gitlab-artifacts, git-lfs, gitlab-uploads,
# gitlab-packages).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-object-storage
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: gitlab-object-storage
    creationPolicy: Owner
    template:
      data:
        config: |
          provider: AWS
          region: garage
          endpoint: http://192.168.30.200:3900
          path_style: true
          aws_access_key_id: {{ .s3_access_key | quote }}
          aws_secret_access_key: {{ .s3_secret_key | quote }}
  data:
    - secretKey: s3_access_key
      remoteRef: { key: gitlab, property: s3_access_key }
    - secretKey: s3_secret_key
      remoteRef: { key: gitlab, property: s3_secret_key }
