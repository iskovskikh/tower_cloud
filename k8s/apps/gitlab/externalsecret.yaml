# Secrets for the GitLab Helm release, from Vault at secret/gitlab.
#
# Populate Vault out-of-band (never commit values):
#   vault kv put secret/gitlab \
#     postgres_password=... redis_password=... initial_root_password=... \
#     oidc_client_secret=... s3_access_key=... s3_secret_key=...
#
# The Postgres/Redis passwords must match the roles created on tower by the
# `tower_storage` role (GITLAB_POSTGRES_PASSWORD / GITLAB_REDIS_PASSWORD), and
# the S3 key must be the Garage key that owns the GitLab buckets
# (GITLAB_S3_ACCESS_KEY / GITLAB_S3_SECRET_KEY).
#
# Rails/gitaly/shell tokens are left to the chart's shared-secrets hook: they
# are generated once in-cluster and survive upgrades.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-secrets
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: gitlab-secrets
    creationPolicy: Owner
    template:
      data:
        postgres-password: "{{ .postgres_password }}"
        redis-password: "{{ .redis_password }}"
        initial-root-password: "{{ .initial_root_password }}"
  data:
    - secretKey: postgres_password
      remoteRef: { key: gitlab, property: postgres_password }
    - secretKey: redis_password
      remoteRef: { key: gitlab, property: redis_password }
    - secretKey: initial_root_password
      remoteRef: { key: gitlab, property: initial_root_password }
