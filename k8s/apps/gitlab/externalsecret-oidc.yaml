# Keycloak OIDC provider for GitLab (realm "tower", confidential client
# "gitlab"). The chart reads this Secret's `provider` key as the OmniAuth
# provider configuration.
#
# `oidc_client_secret` is the same Vault value that the keycloak namespace
# mirrors (k8s/apps/keycloak/externalsecret-gitlab.yaml) and that ansible role
# keycloak_config writes into the `gitlab` client. The issuer is the public,
# split-horizon name so the browser and the Rails pods see the same issuer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-oidc
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: gitlab-oidc
    creationPolicy: Owner
    template:
      data:
        provider: |
          name: openid_connect
          label: Keycloak
          args:
            name: openid_connect
            scope: ["openid", "profile", "email"]
            response_type: code
            issuer: https://auth.metoda.cc/realms/tower
            discovery: true
            client_auth_method: query
            uid_field: preferred_username
            pkce: true
            client_options:
              identifier: gitlab
              secret: {{ .oidc_client_secret | quote }}
              redirect_uri: https://gitlab.metoda.cc/users/auth/openid_connect/callback
  data:
    - secretKey: oidc_client_secret
      remoteRef: { key: gitlab, property: oidc_client_secret }
