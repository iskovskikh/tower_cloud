# Smoke test for the Vault -> External Secrets path (backing Vault secret
# `secret/demo` is written out-of-band; see docs/network/CHANGELOG.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-demo
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: vault-demo
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: demo
        property: username
    - secretKey: password
      remoteRef:
        key: demo
        property: password
