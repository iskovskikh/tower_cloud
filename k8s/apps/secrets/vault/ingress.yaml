apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: vault
  annotations:
    cert-manager.io/cluster-issuer: tower-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vault.k8s.lan
      secretName: vault-tls
  rules:
    - host: vault.k8s.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200
