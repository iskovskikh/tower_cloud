# Dedicated iSCSI LUN on tower (backstore "vault" = lun 1) for Vault Raft data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tower-iscsi-vault
  labels:
    app.kubernetes.io/name: vault
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: tower-iscsi-static
  iscsi:
    targetPortal: 192.168.30.200:3260
    iqn: iqn.2026-10.lan.tower:k8s
    lun: 1
    fsType: ext4
    readOnly: false
