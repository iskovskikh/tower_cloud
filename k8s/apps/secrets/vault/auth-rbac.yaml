# Lets the Vault server use its own ServiceAccount token to call the
# Kubernetes TokenReview/SubjectAccessReview APIs (needed for the kubernetes
# auth method).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
