apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
spec:
  serviceName: vault-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vault
          image: hashicorp/vault:1.21.4
          args:
            - server
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8200
            - name: https-internal
              containerPort: 8201
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: VAULT_SKIP_VERIFY
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
            - name: SKIP_CHOWN
              value: "true"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VAULT_API_ADDR
              value: http://$(POD_IP):8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
        # Unseals Vault automatically (unseal keys come from the vault-unseal
        # Secret, created out-of-band — never committed).
        - name: auto-unseal
          image: hashicorp/vault:1.21.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                st=$(vault status -format=json 2>/dev/null || true)
                if echo "$st" | grep -qE '"initialized"[[:space:]]*:[[:space:]]*true' \
                   && echo "$st" | grep -qE '"sealed"[[:space:]]*:[[:space:]]*true'; then
                  for k in "$KEY1" "$KEY2" "$KEY3"; do
                    vault operator unseal "$k" >/dev/null 2>&1 || true
                  done
                fi
                sleep 15
              done
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: KEY1
              valueFrom:
                secretKeyRef:
                  name: vault-unseal
                  key: key1
            - name: KEY2
              valueFrom:
                secretKeyRef:
                  name: vault-unseal
                  key: key2
            - name: KEY3
              valueFrom:
                secretKeyRef:
                  name: vault-unseal
                  key: key3
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: vault-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: tower-iscsi-static
        resources:
          requests:
            storage: 10Gi
