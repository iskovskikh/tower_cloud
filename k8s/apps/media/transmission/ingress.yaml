# Whole-host Keycloak SSO (forward-auth) with an internal-CA TLS cert.
# Transmission's own RPC auth is disabled (see configmap-settings.yaml), so the
# browser gets a single login at Keycloak and no Basic prompt. All paths
# (including /transmission/rpc) sit behind SSO.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: tower-ca
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.k8s.lan/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "x-auth-request-user, x-auth-request-email"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - transmission.k8s.lan
      secretName: transmission-tls
  rules:
    - host: transmission.k8s.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transmission
                port:
                  number: 9091
