# RPC/web credentials live in Vault at secret/transmission (generated by the
# Ansible role vault_config; never in git). The linuxserver image reads them via
# the USER/PASS environment variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transmission-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: transmission-secrets
    creationPolicy: Owner
  data:
    - secretKey: rpc-username
      remoteRef: { key: transmission, property: rpc_username }
    - secretKey: rpc-password
      remoteRef: { key: transmission, property: rpc_password }
