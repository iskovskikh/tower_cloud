# Jellyfin state (/config: library SQLite DBs, metadata, plugins, user data).
# SQLite needs real POSIX locking and a single writer, and is unsafe on NFS, so
# this is a dynamic local-path volume (StorageClass tower-local) on the node
# Jellyfin runs on. NOTE: node-local, off the tower array, not backed up — see
# docs/storage/local-path.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tower-local
  resources:
    requests:
      storage: 5Gi
---
# Media library: the same tower export Transmission writes to
# (/mnt/raid1/share/downloads), mounted RWX at /media. A PV binds to exactly one
# PVC, so Jellyfin gets its own PV over the shared export (distinct
# volumeHandle from the Transmission one).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tower-nfs-media-jellyfin
spec:
  capacity:
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: tower-nfs
  mountOptions:
    - vers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.30.200#/mnt/raid1/share/downloads#jellyfin
    volumeAttributes:
      server: 192.168.30.200
      share: /mnt/raid1/share/downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: tower-nfs
  volumeName: tower-nfs-media-jellyfin
  resources:
    requests:
      storage: 4Ti
